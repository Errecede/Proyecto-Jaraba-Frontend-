<div class="flex items-center justify-center min-h-screen bg-gray-900 text-white">
  <div class="w-full max-w-md p-8 bg-gray-800 rounded-xl shadow-lg border border-gray-700">

    <h2 class="text-2xl font-bold text-center mb-6 text-cyan-400">RobCorp Bank - Login</h2>


    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">


      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Correo Electrónico</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded-lg focus:outline-none focus:border-cyan-500 text-white"
          placeholder="usuario@robcorp.com"
        />
        @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
          <small class="text-red-400 text-xs mt-1 block">Ingresa un correo válido.</small>
        }
      </div>

      <div>
        <label class="block text-sm font-medium mb-1 text-gray-300">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="w-full px-4 py-2 bg-gray-900 border border-gray-600 rounded-lg focus:outline-none focus:border-cyan-500 text-white"
          placeholder="••••••••"
        />
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <small class="text-red-400 text-xs mt-1 block">La contraseña debe tener al menos 6 caracteres.</small>
        }
      </div>

      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="w-full py-2 px-4 bg-cyan-600 hover:bg-cyan-500 disabled:bg-gray-600 disabled:cursor-not-allowed text-white font-semibold rounded-lg transition duration-200 shadow-md"
      >
        Entrar al Sistema
      </button>

    </form>
  </div>
</div>
